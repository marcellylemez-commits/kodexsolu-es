<main class="demo-shell" id="demo-conteudo"><div class="ops-page"><header class="ops-heading"><div><span class="section-eyebrow">Sistema demonstrativo</span><h1>Recrutamento e seleção</h1><p>Use dados fictícios. Os registros ficam somente neste navegador.</p></div><button id="op-export" class="preview-btn">Exportar CSV</button></header><div class="metric-strip" id="op-metrics"></div><p class="ops-status" id="op-status" role="status" aria-live="polite"></p><div class="ops-layout"><aside class="ops-panel"><h2 id="op-form-title">Cadastrar candidato</h2><form id="op-form" class="ops-form"><label for="op-name">Nome do candidato<input id="op-name" name="name" type="text" required maxlength="80"></label><label for="op-role">Vaga<input id="op-role" name="role" type="text" required maxlength="80"></label><label for="op-score">Avaliação (0 a 100)<input id="op-score" name="score" type="number" required maxlength="80" min="0" max="100" step="1"></label><label for="op-stage">Etapa<select id="op-stage" name="stage"><option>Inscrição</option><option>Triagem</option><option>Entrevista</option><option>Proposta</option><option>Contratado</option><option>Não selecionado</option></select></label><button class="btn btn-primary" type="submit">Salvar registro</button><button class="preview-btn" type="button" id="op-cancel">Cancelar edição</button></form></aside><section class="ops-panel"><div class="ops-toolbar"><label for="op-search">Buscar<input type="search" id="op-search" placeholder="Nome ou vaga"></label><label for="op-filter">Vaga<select id="op-filter"><option value="todos">Todas as vagas</option></select></label></div><div class="ops-table-wrap"><table class="ops-table"><caption id="op-count">Registros da demonstração</caption><thead><tr><th scope="col">Candidato / vaga</th><th scope="col">Avaliação</th><th scope="col">Etapa</th><th scope="col">Ações</th></tr></thead><tbody id="op-rows"></tbody></table></div></section></div></div></main><div class="demo-toast" id="toast" role="status" aria-live="polite"></div><script src="../js/main.js"></script><script src="js/operations.js"></script><script src="js/recrutamento.js"></script><script src="../js/experience.js"></script><script src="../js/claude-enhance.js"></script></body></html>
